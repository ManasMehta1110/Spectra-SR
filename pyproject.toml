[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-sr"
version = "0.1.0"
description = "Physically-constrained Sentinel-2 super-resolution with calibrated per-pixel uncertainty -- SIH 2026, NTRO PS26142"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0",
    "torch>=2.2",
    "rasterio>=1.3",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# Sentinel-2 acquisition against the Copernicus Data Space Ecosystem (Section 4 of the plan).
data = ["sentinelhub>=3.10", "pystac-client>=0.8", "stackstac>=0.5"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
